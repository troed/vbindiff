name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  distro:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - opensuse/tumbleweed:latest
          - opensuse/leap:16.0
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: >-
          zypper -n install --no-recommends
          gcc-c++ make autoconf automake ncurses-devel git
          perl-Template-Toolkit perl-TimeDate rpm-build rpmlint

      - name: Build from the git tree
        run: |
          autoreconf -fi
          ./configure
          make -j"$(nproc)"

      - name: Check version strings and smoke-test the binary
        run: |
          ./vbindiff --version | grep -q 'VBinDiff 3\.0_beta5'
          ./vbindiff -L > /dev/null
          grep -q 'VBinDiff 3\.0_beta5' vbindiff.1

      - name: Build and lint the RPM
        run: |
          set -x
          topdir=/tmp/rpmbuild
          mkdir -p "$topdir/SOURCES" "$topdir/SPECS"
          tar --exclude-vcs --exclude=./rpmbuild \
              --transform 's,^\.,vbindiff-3.0~beta5,' \
              -czf "$topdir/SOURCES/vbindiff-3.0~beta5.tar.gz" .
          cp packaging/opensuse/vbindiff.spec "$topdir/SPECS/"

          rc=0
          rpmbuild --define 'debug_package %{nil}' \
              --define "_topdir $topdir" -ba "$topdir/SPECS/vbindiff.spec" \
              > /tmp/rpmbuild.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            tail -n 30 /tmp/rpmbuild.log | while IFS= read -r line; do
              echo "::error::rpmbuild: $line"
            done
            exit "$rc"
          fi

          rpmlint -r packaging/opensuse/vbindiff-rpmlintrc \
              "$topdir"/RPMS/*/*.rpm > /tmp/rpmlint.log 2>&1 || true
          if grep -q ': E: ' /tmp/rpmlint.log; then
            grep ': E: ' /tmp/rpmlint.log | while IFS= read -r line; do
              echo "::error::rpmlint: $line"
            done
            exit 1
          fi
          cat /tmp/rpmlint.log

      - name: Install the RPM and smoke-test the packaged files
        run: |
          set -x
          rpmfile=$(ls /tmp/rpmbuild/RPMS/*/*.rpm)
          if ! zypper -n install --allow-unsigned-rpm "$rpmfile" > /tmp/install.log 2>&1; then
            tail -n 20 /tmp/install.log | while IFS= read -r line; do
              echo "::error::zypper: $line"
            done
            exit 1
          fi
          vbindiff --version | grep -q 'VBinDiff 3\.0_beta5'

          # Container images install with documentation excluded, so check the
          # packaged payload rather than the unpacked filesystem.
          rpm -qlp "$rpmfile" | grep -qx '/usr/share/man/man1/vbindiff\.1\.gz'
          rpm -qlp "$rpmfile" | grep -qx '/usr/share/licenses/vbindiff/COPYING'
          rpm2cpio "$rpmfile" \
            | cpio -i --to-stdout ./usr/share/man/man1/vbindiff.1.gz \
            | gzip -dc | grep -q 'VBinDiff 3\.0_beta5'
